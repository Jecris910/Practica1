version: "2"

services:
  web:
    build: ./app
    ports:
      - "${WEB_PORT}:5000"
    env_file:
      - ./config/.env.dev
    depends_on:
      - db
    networks:
      - internal_net

  db:
    build: ./db
    env_file:
      - ./config/.env.dev
    volumes:
      - mysql_dev_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - internal_net

networks:
  internal_net:

volumes:
  mysql_dev_data:
